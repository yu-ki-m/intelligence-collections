<div class="rc-bar" data-rc-key="{{key}}" data-rc-score="{{score}}" data-rc-band="{{bandId}}"><div class="rc-bar-inner">
<label class="rc-check"><input type="checkbox" class="rc-checkbox" data-rc-key="{{key}}"><span>確認済み</span></label>
<span class="rc-score" role="img" aria-label="人が見ない場合のリスク {{score}} / 10({{bandLabel}})"><small>リスク</small><b>{{score}}</b><small>/10</small></span>
<span class="rc-band">{{bandLabel}}</span>
<span class="rc-category">{{category}}</span>
<p class="rc-reason">{{reason}}</p>{{{points}}}
</div></div>

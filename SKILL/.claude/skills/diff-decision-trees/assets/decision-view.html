<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>条件と結果の判定決定木</title><style>
*{box-sizing:border-box}body{margin:0;color:#25354b;background:#f4f6f9;font:14px system-ui,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer;background:white;color:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:7px 10px}button:hover{background:#eef6f3}button:focus-visible,input:focus-visible{outline:3px solid #5880db}header{padding:18px 24px;background:white;border-bottom:1px solid #dce3ec}h1{font-size:23px;margin:0 0 7px}.muted{color:#64748b;font-size:12px;line-height:1.7}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;background:white;border-bottom:1px solid #dce3ec}input{padding:8px;border:1px solid #cbd5e1;border-radius:7px;width:180px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100vh - 155px);min-height:450px}#viewport{overflow:hidden;position:relative;background:radial-gradient(#d5dfe8 1px,transparent 1px);background-size:20px 20px;outline-offset:-3px}#viewport.panning,#viewport.panning *{cursor:grabbing!important;user-select:none}svg,#nodes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;border:1px solid #bfccd9;border-radius:10px;display:flex;background:white;overflow:hidden;pointer-events:auto;box-shadow:0 2px 5px #24374c09}.node.result{background:#eef9f3;border-color:#94c9b5}.node.selected{border:2px solid #14826d;box-shadow:0 0 0 3px #14826d22}.select{background:transparent;text-align:left;border:0;flex:1;min-width:0;overflow:hidden;padding:10px}.select small{display:block;color:#64748b;font-size:.72em;white-space:nowrap}.select b{display:block;margin-top:7px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.toggle{border:0;border-left:1px solid #dce3ec;border-radius:0;width:30px;padding:0;background:#f5faf8}.label{position:absolute;background:#f4f6f9;color:#4c6479;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}aside{padding:20px;background:white;border-left:1px solid #dce3ec;overflow:auto}h2{font-size:18px;margin:8px 0 18px}h3{font-size:13px;margin:20px 0 8px}ol{padding-left:20px;line-height:1.9;font-size:13px}pre{font:12px/1.7 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;padding:12px;border-radius:8px}#outcome{background:#eaf7f0;color:#17634e}details{margin-top:18px}summary{cursor:pointer;font-size:13px}#status{position:absolute;bottom:10px;left:12px;background:#ffffffeb;border:1px solid #dce3ec;border-radius:6px;padding:5px 10px;font-size:11px;pointer-events:none}#searchResults{max-height:200px;overflow:auto}#searchResults button{display:block;width:100%;text-align:left;font-size:12px;margin:4px 0}#csv{margin-top:12px}@media(max-width:750px){.workspace{display:block;height:auto}#viewport{height:65vh;min-height:400px}aside{border-top:1px solid #dce3ec}header{padding:14px}.toolbar{padding:9px}}
</style><header><h1 id="title"></h1><div class="muted" id="description"></div></header><div class="toolbar"><select id="tree" aria-label="判定対象と版"></select><button id="home">先頭へ</button><button id="fit">全体表示</button><button id="minus" aria-label="縮小">−</button><span id="zoom">100%</span><button id="plus" aria-label="拡大">＋</button><label class="muted">展開 <select id="depth"><option value="2">2段</option><option value="4">4段</option><option value="999999">すべて</option></select></label><input id="query" placeholder="条件・結果を検索" aria-label="条件と結果を検索"><button id="search">検索</button></div><div class="workspace"><div id="viewport" tabindex="0" aria-label="右ドラッグで移動、ホイールでズーム、矢印キーで移動"><svg id="edges"></svg><div id="nodes"></div><div id="status"></div></div><aside><div class="muted">選択した条件・結果</div><h2 id="selection"></h2><h3>ここまでの条件</h3><ol id="route"></ol><pre id="outcome"></pre><h3>具体入力・テスト</h3><pre id="tests"></pre><button id="csv">この木のテストCSV</button><details><summary>根拠・コードの処理順序</summary><pre id="evidence"></pre></details><details><summary>調査範囲・検証・未解決</summary><pre id="audit"></pre><button id="modelDownload">調査モデルJSON</button></details><div id="searchResults"></div></aside></div>
<script type="application/json" id="data">__DECISION_DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),vp=$('viewport'),W=220,H=82,DX=390,DY=110;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodeMap=new Map(D.trees.flatMap(t=>t.nodes.map(n=>[n.id,n]))),treeMap=new Map(D.trees.map(t=>[t.id,t])),states=new Map();let tree,state,placed=[],parent=new Map(),pending=false;
$('title').textContent=D.title;$('description').textContent='入力・状態の条件から最終結果を確認する。右ドラッグで自由移動、ホイールでズーム。';$('audit').textContent=JSON.stringify(D.audit,null,2);
$('tree').innerHTML=D.trees.map(t=>`<option value="${esc(t.id)}">${esc(t.title)} · ${esc(t.revision_label)}</option>`).join('');
function schedule(){if(!pending){pending=true;requestAnimationFrame(draw)}}
function layout(){placed=[];parent=new Map();let row=0;const stack=[{id:tree.root,d:0,done:false}];while(stack.length){const q=stack.pop(),n=nodeMap.get(q.id);if(q.done){const ch=n.branches.map(b=>nodeMap.get(b.to));n.y=(ch[0].y+ch.at(-1).y)/2;continue}n.x=30+q.d*DX;n.depth=q.d;placed.push(n);if(n.kind==='condition'&&state.open.has(n.id)){stack.push({...q,done:true});for(let i=n.branches.length-1;i>=0;i--){const b=n.branches[i];parent.set(b.to,{id:n.id,label:b.label});stack.push({id:b.to,d:q.d+1,done:false})}}else n.y=30+row++*DY;}schedule()}
function draw(){pending=false;const {x,y,s}=state,vw=vp.clientWidth,vh=vp.clientHeight,paths=[],labels=[];const on=placed.filter(n=>(n.x+W-x)*s>-100&&(n.x-x)*s<vw+100&&(n.y+H-y)*s>-100&&(n.y-y)*s<vh+100);
for(const n of placed){const p=parent.get(n.id);if(!p)continue;const a=nodeMap.get(p.id),x1=(a.x+W-x)*s,x2=(n.x-x)*s,y1=(a.y+H/2-y)*s,y2=(n.y+H/2-y)*s,m=x1+(x2-x1)*.25;if(x2<-100||x1>vw+100||Math.max(y1,y2)<-100||Math.min(y1,y2)>vh+100)continue;paths.push(`<path d="M${x1} ${y1}H${m}V${y2}H${x2}" fill="none" stroke="#aebed0" stroke-width="1.5"/>`);if(y2>-25&&y2<vh+25)labels.push(`<div class="label" title="${esc(p.label)}" style="left:${m+4}px;top:${y2-22*s}px;font-size:${11*s}px;max-width:${140*s}px">${esc(p.label)}</div>`)}
$('edges').innerHTML=paths.join('');$('nodes').innerHTML=on.map(n=>`<div class="node ${n.kind==='result'?'result':''} ${state.selected===n.id?'selected':''}" style="left:${(n.x-x)*s}px;top:${(n.y-y)*s}px;width:${W*s}px;height:${H*s}px;font-size:${14*s}px"><button class="select" data-id="${esc(n.id)}" title="${esc(n.label)}"><small>${n.kind==='condition'?'条件':'最終結果'} · ${esc(n.change||'')}</small><b>${esc(n.label)}</b></button>${n.kind==='condition'?`<button class="toggle" data-toggle="${esc(n.id)}" aria-expanded="${state.open.has(n.id)}" aria-label="枝を開閉">${state.open.has(n.id)?'−':'＋'}</button>`:''}</div>`).join('')+labels.join('');$('zoom').textContent=Math.round(s*100)+'%';$('status').textContent=`全 ${tree.nodes.length} / 展開 ${placed.length} / 描画 ${on.length} ノード`;}
function route(id){const out=[];let n=nodeMap.get(id);while(n.id!==tree.root){const p=tree.nodes.find(v=>v.branches?.some(b=>b.to===n.id));if(!p)break;const branch=p.branches.find(b=>b.to===n.id);out.unshift(p.label+'：'+branch.label+' ['+branch.predicate+']');n=p}return out}
function detail(){const n=nodeMap.get(state.selected);$('selection').textContent=n.label;$('route').innerHTML=route(n.id).map(s=>'<li>'+esc(s)+'</li>').join('')||'<li>まだ条件を選択していない</li>';$('outcome').textContent=n.kind==='result'?JSON.stringify(n.outcome,null,2):'右側の枝から条件を選ぶと、その条件に対応する結果を確認できる。';$('tests').textContent=JSON.stringify(n.tests||[],null,2);$('evidence').textContent=JSON.stringify({input_variable:n.input_variable,partition_reason:n.partition_reason,branches:n.branches,source_node_ids:n.source_node_ids,code_trace:n.code_trace||[],evidence:n.evidence||[],source_nodes:D.investigation_model.nodes.filter(v=>n.source_node_ids.includes(v.id))},null,2)}
function home(){const n=nodeMap.get(tree.root);state.x=n.x-45;state.y=n.y+H/2-vp.clientHeight/(2*state.s);schedule()}
function switchTree(id){tree=treeMap.get(id);if(!states.has(id)){states.set(id,{x:0,y:0,s:1,selected:tree.root,open:new Set([tree.root])});}state=states.get(id);$('tree').value=id;layout();detail();if(!state.visited){home();state.visited=true;}}
$('tree').onchange=()=>switchTree($('tree').value);$('home').onclick=home;$('fit').onclick=()=>{const maxX=Math.max(...placed.map(n=>n.x))+W,minY=Math.min(...placed.map(n=>n.y)),maxY=Math.max(...placed.map(n=>n.y))+H;state.s=Math.max(.05,Math.min(1.5,Math.min(vp.clientWidth/(maxX+60),vp.clientHeight/(maxY-minY+60))));state.x=-20;state.y=minY-30;schedule()};
$('nodes').onclick=e=>{const b=e.target.closest('[data-id]'),t=e.target.closest('[data-toggle]');if(b){state.selected=b.dataset.id;detail();schedule()}if(t){const n=nodeMap.get(t.dataset.toggle),old=n.y;state.open.has(n.id)?state.open.delete(n.id):state.open.add(n.id);layout();state.y+=n.y-old;}};
$('depth').onchange=()=>{state.open.clear();const todo=[[tree.root,0]];while(todo.length){const [id,d]=todo.pop(),n=nodeMap.get(id);if(n.kind==='condition'&&d<+$('depth').value){state.open.add(id);n.branches.forEach(b=>todo.push([b.to,d+1]))}}layout();home()};
function zoom(f,cx=vp.clientWidth/2,cy=vp.clientHeight/2){const wx=state.x+cx/state.s,wy=state.y+cy/state.s;state.s=Math.max(.05,Math.min(3,state.s*f));state.x=wx-cx/state.s;state.y=wy-cy/state.s;schedule()}$('minus').onclick=()=>zoom(1/1.2);$('plus').onclick=()=>zoom(1.2);vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect(),unit=e.deltaMode===1?16:e.deltaMode===2?vp.clientHeight:1;zoom(Math.exp(-Math.max(-150,Math.min(150,e.deltaY*unit))*.002),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;vp.addEventListener('contextmenu',e=>e.preventDefault());vp.addEventListener('pointerdown',e=>{if(e.button!==2)return;e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY};vp.setPointerCapture(e.pointerId);vp.classList.add('panning')});vp.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;state.x-=(e.clientX-drag.x)/state.s;state.y-=(e.clientY-drag.y)/state.s;drag.x=e.clientX;drag.y=e.clientY;schedule()});function stop(e){if(!drag||drag.id!==e.pointerId)return;drag=null;vp.classList.remove('panning');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId)}for(const e of ['pointerup','pointercancel','lostpointercapture'])vp.addEventListener(e,stop);
vp.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','+','-'].includes(e.key))return;e.preventDefault();if(e.key==='Home')home();else if(e.key==='+')zoom(1.2);else if(e.key==='-')zoom(1/1.2);else{state.x+=({'ArrowLeft':-100,'ArrowRight':100}[e.key]||0)/state.s;state.y+=({'ArrowUp':-100,'ArrowDown':100}[e.key]||0)/state.s;schedule()}});
$('search').onclick=()=>{const q=$('query').value.trim().toLowerCase();if(!q){$('searchResults').replaceChildren();return}const hits=D.trees.flatMap(t=>t.nodes.filter(n=>JSON.stringify(n).toLowerCase().includes(q)).map(n=>({t,n})));$('searchResults').innerHTML='<h3>検索結果 '+hits.length+'件（先頭100件）</h3>'+hits.slice(0,100).map(({t,n})=>`<button data-tree="${esc(t.id)}" data-node="${esc(n.id)}">${esc(t.revision_label+' / '+n.label)}</button>`).join('')};$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click()};$('searchResults').onclick=e=>{const b=e.target.closest('[data-node]');if(!b)return;switchTree(b.dataset.tree);let n=nodeMap.get(b.dataset.node);state.selected=n.id;while(n.id!==tree.root){const p=tree.nodes.find(v=>v.branches?.some(b=>b.to===n.id));if(!p)break;state.open.add(p.id);n=p}layout();n=nodeMap.get(state.selected);state.x=n.x+W/2-vp.clientWidth/(2*state.s);state.y=n.y+H/2-vp.clientHeight/(2*state.s);detail();schedule()};
$('csv').onclick=()=>{const rows=[['結果ID','条件','最終結果','テストケース'],...tree.nodes.filter(n=>n.kind==='result').flatMap(n=>n.tests.map(test=>[n.id,route(n.id).join(' / '),JSON.stringify(n.outcome),JSON.stringify(test)]))];const cell=v=>{let s=String(v);if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='decision-tests.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('modelDownload').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(D.investigation_model,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='model.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};new ResizeObserver(schedule).observe(vp);switchTree(D.trees[0].id);
</script></html>
